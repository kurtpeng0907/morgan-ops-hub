<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>線上預約需求｜Morgan SPA</title>
  <link rel="stylesheet" href="/tailwind.generated.css?v=public-booking-v1">
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
    :root{--ink:#18312d;--muted:#687a76;--teal:#157d75;--soft:#eaf5f2;--line:#d7e5e1;--bg:#f5f8f7;}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans TC',sans-serif}.shell{max-width:1080px;margin:auto;padding:24px 16px 64px}.card{background:#fff;border:1px solid var(--line);border-radius:18px}.hero{padding:26px}.brand{color:var(--teal);font-size:12px;font-weight:900;letter-spacing:.1em}.hero h1{margin:10px 0 8px;font-size:clamp(28px,5vw,42px);line-height:1.2;font-weight:900}.hero p{margin:0;color:var(--muted);font-weight:700}.steps{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.step{padding:6px 10px;border-radius:999px;background:#fff;border:1px solid var(--line);color:var(--muted);font-size:12px;font-weight:900}.step.active{background:var(--soft);color:var(--teal);border-color:#9bcfc4}.workspace{display:grid;gap:16px;margin-top:16px}.panel{padding:20px}.kicker{color:var(--teal);font-size:12px;font-weight:900;letter-spacing:.05em}.panel h2{margin:4px 0 14px;font-size:20px;font-weight:900}.hint{margin:0 0 14px;color:var(--muted);font-size:14px;font-weight:700}.input{display:block;width:100%;border:1px solid #bfd3ce;border-radius:11px;padding:12px;background:white;color:var(--ink);font:700 16px inherit}.input:focus{outline:3px solid rgba(21,125,117,.14);border-color:var(--teal)}.choices{display:grid;gap:10px}.choice{width:100%;border:1px solid var(--line);border-radius:12px;background:#fff;padding:13px;text-align:left;font:800 15px inherit;color:var(--ink)}.choice:hover{border-color:#8fc9bc}.choice.selected{border-color:var(--teal);background:var(--soft);box-shadow:inset 3px 0 var(--teal)}.slot-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.slot-grid .choice{text-align:center;padding:11px 5px}.therapist{display:grid;grid-template-columns:48px 1fr;align-items:center;gap:12px}.avatar{display:grid;width:48px;height:48px;place-items:center;border-radius:50%;background:#d9ebe6;color:var(--teal);font-size:20px;font-weight:900;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.therapist small{display:block;margin-top:3px;color:var(--muted);font-size:12px;font-weight:700}.btn{width:100%;border:0;border-radius:11px;padding:14px 16px;background:var(--teal);color:white;font:900 16px inherit}.btn:disabled{background:#cfdad7;color:#74817e;cursor:not-allowed}.state{display:grid;min-height:128px;place-items:center;border:1px dashed #bdd8d2;border-radius:13px;background:linear-gradient(135deg,#fff,var(--soft));padding:20px;text-align:center;color:var(--muted);font-weight:800}.error{border-color:#fecdd3;background:#fff1f2;color:#be123c}.success{border-color:#a7e2d2;background:#effcf7;color:#12675e}.hidden{display:none!important}.form-grid{display:grid;gap:13px}.label{display:grid;gap:6px;font-size:13px;font-weight:900}.summary{display:grid;gap:5px;border-radius:12px;background:var(--soft);padding:14px;color:#28534c;font-size:14px;font-weight:800}.summary b{font-size:17px;color:var(--ink)}
    @media(min-width:768px){.shell{padding-top:44px}.hero{padding:34px}.workspace{grid-template-columns:minmax(0,1fr) minmax(320px,.8fr);align-items:start}.contact-panel{position:sticky;top:18px}.slot-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
    @media(max-width:389px){.shell{padding-left:12px;padding-right:12px}.panel{padding:16px}.slot-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
  </style>
</head>
<body>
  <main class="shell">
    <section class="card hero"><div class="brand">MORGAN SPA</div><h1>提出預約需求</h1><p>選擇方便的時段與偏好師傅；送出後由店家確認安排。</p></section>
    <div class="steps" aria-label="預約步驟"><span class="step active">1 日期與服務</span><span class="step">2 選時段</span><span class="step">3 選師傅</span><span class="step">4 留聯絡方式</span></div>
    <section id="success" class="card panel state success hidden" aria-live="polite"><div><strong class="text-xl">已送出預約需求</strong><p id="successText" class="mt-2">店家確認後會再與您聯絡；此刻尚未成立正式預約。</p></div></section>
    <section id="bookingWorkspace" class="workspace">
      <div class="grid gap-4">
        <section class="card panel"><div class="kicker">第一步</div><h2>日期與服務</h2><div class="choices"><label class="label">希望日期<input id="date" type="date" class="input" required></label><div><label class="label">服務課程</label><div id="courseList" class="choices mt-2"><div class="state">正在讀取可預約課程…</div></div></div></div></section>
        <section class="card panel"><div class="kicker">第二步</div><h2>可選時段</h2><p id="slotHint" class="hint">請先選擇日期與服務。</p><div id="slotList" class="slot-grid" aria-live="polite"></div></section>
        <section class="card panel"><div class="kicker">第三步</div><h2>選擇服務師傅</h2><p id="therapistHint" class="hint">選定時段後顯示可接師傅。</p><div id="therapistList" class="choices" aria-live="polite"></div></section>
      </div>
      <aside class="card panel contact-panel"><div class="kicker">第四步</div><h2>留下聯絡方式</h2><div id="selectionSummary" class="summary"><span>尚未完成選擇</span><b>請依序選擇日期、課程、時段與師傅</b></div><form id="bookingForm" class="form-grid mt-4"><label class="label">姓名（選填）<input id="customerName" class="input" maxlength="80" autocomplete="name"></label><label class="label">聯絡方式<input id="customerContact" class="input" maxlength="120" autocomplete="tel" required placeholder="電話或 LINE ID"></label><label class="label">需求備註（選填）<textarea id="customerNote" class="input" maxlength="1000" rows="4" placeholder="例如偏好力道、希望加強部位"></textarea></label><button id="submit" class="btn" disabled>請先完成選擇</button><p id="message" class="hidden m-0 rounded-xl p-3 text-sm font-black" aria-live="polite"></p></form><p class="mt-4 text-xs font-bold leading-relaxed text-slate-500">資料僅用於本次預約確認。送出不代表正式預約已成立。</p></aside>
    </section>
  </main>
  <script>
  (() => {
    const state = { date:'', service:'', time:'', therapist:null, courses:[], slots:[], therapists:[], requestId: newRequestId(), liffIdToken:'' };
    let refreshVersion = 0;
    const $ = id => document.getElementById(id);
    const localDate = () => { const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
    const escape = value => String(value || '').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    function newRequestId(){ return `PUB-${crypto.randomUUID ? crypto.randomUUID().replace(/-/g,'') : `${Date.now()}${Math.random().toString(36).slice(2)}`}`; }
    function resetRequest(){ state.requestId = newRequestId(); }
    function selectedCourse(){ return state.courses.find(x => x.code === state.service); }
    function setMessage(text='', kind=''){ const el=$('message'); el.textContent=text; el.className = text ? `m-0 rounded-xl p-3 text-sm font-black ${kind === 'error' ? 'error' : ''}` : 'hidden'; }
    async function fetchSnapshot(){
      const p=new URLSearchParams(); if(state.date)p.set('date',state.date); if(state.service)p.set('service',state.service); if(state.time)p.set('time',state.time);
      const response=await fetch(`/api/public-booking?${p}`, {cache:'no-store',headers:{Accept:'application/json','Cache-Control':'no-store'}}); const payload=await response.json();
      if(!response.ok || !payload.success) throw Object.assign(new Error(payload.error || 'public_booking_unavailable'), {code:payload.error}); return payload.data;
    }
    function renderCourses(){ $('courseList').innerHTML=state.courses.length ? state.courses.map(c => `<button type="button" class="choice ${c.code===state.service?'selected':''}" data-course="${escape(c.code)}"><b>${escape(c.name)}</b><small class="block mt-1 text-slate-500">${c.duration} 分鐘 · $${Number(c.price).toLocaleString('zh-TW')}</small></button>`).join('') : '<div class="state">目前沒有可預約服務。</div>'; document.querySelectorAll('[data-course]').forEach(el=>el.onclick=async()=>{if(state.service===el.dataset.course)return; state.service=el.dataset.course;state.time='';state.therapist=null;resetRequest();await refresh();}); }
    function renderSlots(){ const list=$('slotList'); if(!state.date||!state.service){list.innerHTML='';return;} if(!state.slots.length){$('slotHint').textContent='這一天沒有符合條件的可選時段，請改選日期或服務。';list.innerHTML='';return;} $('slotHint').textContent='時段以 30 分鐘為間距，送出前會再次確認。'; list.innerHTML=state.slots.map(t=>`<button type="button" class="choice ${t===state.time?'selected':''}" data-time="${t}">${t}</button>`).join(''); document.querySelectorAll('[data-time]').forEach(el=>el.onclick=async()=>{if(state.time===el.dataset.time)return;state.time=el.dataset.time;state.therapist=null;resetRequest();await refresh();}); }
    function renderTherapists(){ const list=$('therapistList'); if(!state.time){$('therapistHint').textContent='選定時段後顯示可接師傅。';list.innerHTML='';return;} if(!state.therapists.length){$('therapistHint').textContent='此時段已無可接師傅，請選擇其他時段。';list.innerHTML='';return;} $('therapistHint').textContent='僅顯示此時段可接的師傅。';list.innerHTML=state.therapists.map(t=>`<button type="button" class="choice therapist ${state.therapist?.id===t.id?'selected':''}" data-therapist="${escape(t.id)}"><span class="avatar">${t.photoUrl?`<img src="${escape(t.photoUrl)}" alt="">`:escape(t.name.slice(0,1))}</span><span><b>${escape(t.name)}</b>${t.specialties?`<small>${escape(t.specialties)}</small>`:''}</span></button>`).join(''); document.querySelectorAll('[data-therapist]').forEach(el=>el.onclick=()=>{state.therapist=state.therapists.find(t=>t.id===el.dataset.therapist);resetRequest();renderTherapists();renderSummary();}); }
    function renderSummary(){const c=selectedCourse(), t=state.therapist; $('selectionSummary').innerHTML=c&&state.date&&state.time&&t?`<span>${escape(state.date)} · ${escape(state.time)}</span><b>${escape(c.name)}｜${escape(t.name)}</b>`:'<span>尚未完成選擇</span><b>請依序選擇日期、課程、時段與師傅</b>'; const button=$('submit');button.disabled=!(c&&state.date&&state.time&&t);button.textContent=button.disabled?'請先完成選擇':'送出預約需求';}
    async function initLiffMember(){try{if(!window.liff)return;const response=await fetch('/api/member-config',{cache:'no-store'});const config=await response.json();if(!response.ok||!config.success||!config.liffId)return;await liff.init({liffId:config.liffId});if(!liff.isLoggedIn()){if(liff.isInClient())return;liff.login({redirectUri:location.href});return;}state.liffIdToken=liff.getIDToken()||'';if(state.liffIdToken)setMessage('已登入 LINE 會員；本次預約可在會員中心追蹤。');}catch{}}
    async function refresh(){ const version=++refreshVersion; try { const data=await fetchSnapshot(); if(version!==refreshVersion)return; state.courses=data.courses||state.courses; state.slots=data.slots||[]; state.therapists=data.therapists||[]; if(state.time&&!state.slots.includes(state.time)){state.time='';state.therapist=null;} if(state.therapist&&!state.therapists.some(t=>t.id===state.therapist.id))state.therapist=null; renderCourses();renderSlots();renderTherapists();renderSummary();setMessage(); } catch(error){ if(version===refreshVersion)setMessage('目前無法讀取可預約資料，請稍後重新整理。','error'); }}
    $('date').min=localDate(); $('date').max=(()=>{const d=new Date();d.setDate(d.getDate()+30);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`})(); $('date').value=localDate();state.date=$('date').value;
    $('date').onchange=async e=>{state.date=e.target.value;state.time='';state.therapist=null;resetRequest();await refresh();};
    $('bookingForm').onsubmit=async e=>{e.preventDefault();if(!$('submit').disabled){const button=$('submit');button.disabled=true;button.textContent='正在確認可用性…';setMessage();try{const r=await fetch('/api/public-booking',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({requestId:state.requestId,date:state.date,time:state.time,service:state.service,therapistId:state.therapist.id,customerName:$('customerName').value,customerContact:$('customerContact').value,customerNote:$('customerNote').value,liffIdToken:state.liffIdToken||undefined})});const p=await r.json();if(!r.ok||!p.success)throw Object.assign(new Error(p.error||'public_booking_unavailable'),{code:p.error});$('successText').textContent=state.liffIdToken?'已收到預約需求，等待 Morgan 確認。確認後可從 Morgan LINE 的會員中心查看進度。':'已收到預約需求，等待 Morgan 確認。';$('bookingWorkspace').classList.add('hidden');$('success').classList.remove('hidden');}catch(error){setMessage(error.code==='booking_conflict'?'這個時段剛剛有變動，請重新選擇時段或師傅。':'送出失敗，請確認網路後再試；已填資料會保留。','error');button.disabled=false;button.textContent='送出預約需求';if(error.code==='booking_conflict'){state.time='';state.therapist=null;await refresh();}}}};
    initLiffMember();refresh();
  })();
  </script>
</body>
</html>
